name: Tests and release artifacts

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest
      - run: python -m pytest --doctest-modules src/hoao

  platform-smoke:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install . pytest
      - run: python examples/quickstart.py
      - run: python examples/historical_calibration.py

  quality-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: python -m pyright --pythonpath "$(which python)"
      - run: python docs/check_docstrings.py
      - run: python -m ruff check src tests examples docs
      - run: python -m sphinx -W --keep-going -b html docs docs/_build/html
      - run: python -m build
      - run: python -m twine check dist/*
      - run: python -m pip install --force-reinstall --no-deps dist/*.whl
      - run: python -m pyright --pythonpath "$(which python)" --verifytypes hoao --ignoreexternal
      - uses: actions/upload-artifact@v4
        with:
          name: distribution
          path: dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: documentation
          path: docs/_build/html/
